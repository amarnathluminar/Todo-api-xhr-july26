<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo XHR</title>
 <!-- BOOTSTRAP CDN LINK -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container my-5">
        <h1 class="text-center text-primary">All Todo List</h1>
        <div id="result" class="row mx-5">
            <div class="col-3-lg "></div>
        </div>
    </div>
    
</body>
<script>
    
    const xhr = new XMLHttpRequest()
    xhr.open("GET","https://jsonplaceholder.typicode.com/todos")
    xhr.send()
     xhr.onreadystatechange = () => {
           
        if(xhr.readyState == 4 && xhr.status == 200){
            const allTodos = JSON.parse(xhr.responseText)
            console.log(allTodos);
            allTodos.forEach(todo=>{
                result.innerHTML += `
                
                <!-- cards -->
                 <div class="card mx-1  my-2" style="width: 18rem;">
                        <div class="card-body shadow">
                            <h5 class="card-title">Todo ${todo.id}</h5>
                            <h6 class="card-subtitle mb-2 text-body-secondary">${todo.userId}</h6>
                            <p class="card-text">${todo.title}</p>
                            <p class="card-text">${todo.completed?`<span class="text-success">Completed</span>`:`<span class="text-danger">Pending</span>`}</p>
                        </div>
                        </div>
            
                `
            })
        }
          

     }


</script>
</html>
